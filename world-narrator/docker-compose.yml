version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: world
      POSTGRES_PASSWORD: world
      POSTGRES_DB: world_narrator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      SERVICE_NAME: api-gateway
      PORT: 8000
      IMAGE_PROCESSOR_URL: http://image-processor:8001
      DOCUMENT_INTELLIGENCE_URL: http://document-intelligence:8002
      NARRATION_DIRECTOR_URL: http://narration-director:8003
      VOICE_SYNTHESIS_URL: http://voice-synthesis:8004
      AUDIO_STREAMER_URL: http://audio-streamer:8005
      ENABLE_MOCK_PIPELINE: "true"
      REQUIRE_API_KEY: "false"
    ports:
      - "8000:8000"
    depends_on:
      - image-processor
      - document-intelligence
      - narration-director
      - voice-synthesis
      - audio-streamer
      - postgres
      - redis
      - minio

  image-processor:
    build:
      context: .
      dockerfile: services/image-processor/Dockerfile
    env_file:
      - .env
    environment:
      SERVICE_NAME: image-processor
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - minio

  document-intelligence:
    build:
      context: .
      dockerfile: services/document-intelligence/Dockerfile
    env_file:
      - .env
    environment:
      SERVICE_NAME: document-intelligence
      PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      - redis
      - minio

  narration-director:
    build:
      context: .
      dockerfile: services/narration-director/Dockerfile
    env_file:
      - .env
    environment:
      SERVICE_NAME: narration-director
      PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      - redis
      - minio

  voice-synthesis:
    build:
      context: .
      dockerfile: services/voice-synthesis/Dockerfile
    env_file:
      - .env
    environment:
      SERVICE_NAME: voice-synthesis
      PORT: 8004
    ports:
      - "8004:8004"
    depends_on:
      - redis
      - minio

  audio-streamer:
    build:
      context: .
      dockerfile: services/audio-streamer/Dockerfile
    env_file:
      - .env
    environment:
      SERVICE_NAME: audio-streamer
      PORT: 8005
    ports:
      - "8005:8005"
    depends_on:
      - redis
      - minio

volumes:
  pgdata:
  minio:
