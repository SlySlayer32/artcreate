apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: world-narrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: world-narrator/api-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: api-gateway
            - name: PORT
              value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: world-narrator
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
