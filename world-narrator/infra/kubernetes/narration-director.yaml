apiVersion: apps/v1
kind: Deployment
metadata:
  name: narration-director
  namespace: world-narrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: narration-director
  template:
    metadata:
      labels:
        app: narration-director
    spec:
      containers:
        - name: narration-director
          image: world-narrator/narration-director:latest
          ports:
            - containerPort: 8003
          env:
            - name: SERVICE_NAME
              value: narration-director
            - name: PORT
              value: "8003"
---
apiVersion: v1
kind: Service
metadata:
  name: narration-director
  namespace: world-narrator
spec:
  selector:
    app: narration-director
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
