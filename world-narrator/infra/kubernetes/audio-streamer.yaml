apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-streamer
  namespace: world-narrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audio-streamer
  template:
    metadata:
      labels:
        app: audio-streamer
    spec:
      containers:
        - name: audio-streamer
          image: world-narrator/audio-streamer:latest
          ports:
            - containerPort: 8005
          env:
            - name: SERVICE_NAME
              value: audio-streamer
            - name: PORT
              value: "8005"
---
apiVersion: v1
kind: Service
metadata:
  name: audio-streamer
  namespace: world-narrator
spec:
  selector:
    app: audio-streamer
  ports:
    - protocol: TCP
      port: 8005
      targetPort: 8005
